<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學位審核輔助 | CityU EE Student Portal</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <!-- Load page-specific CSS after common.css, and deferred JS after common.js. -->
    <script src="../assets/js/common.js" defer></script>
</head>
<body data-page="degree-audit" data-lang="zh">
    <!-- Shared header, sidebar, footer and dialogs are mounted by common.js. -->
    <div class="layout">
        <main class="main" id="mainContent" tabindex="-1">
            <!-- PAGE OWNER: develop this page inside #pageContent. -->
            <section id="pageContent" class="page-content" aria-labelledby="pageTitle" hidden inert>
                <div class="feature-header">
                    <h2 id="pageTitle">
                        <span class="lang-zh">✅ 學位審核輔助</span>
                        <span class="lang-en">✅ Degree Audit Helper</span>

                </div>
                <div class="placeholder-card">
                    <span class="emoji" aria-hidden="true">🚧</span>
                    <span class="status-zh">此功能開發中</span>
                    <span class="status-en">Under Development</span>
                    <span class="hint lang-zh">此區塊為功能掛載預留位置，由負責組員整合。</span>
                    <span class="hint lang-en">Reserved mount point for the assigned teammate to integrate this feature.</span>
                </div>
            </section>
            <noscript><p>請啟用 JavaScript 以使用導覽和示範登入。 / Enable JavaScript for navigation and demo login.</p></noscript>
        </main>
    </div>

</html>
